name: Build Cloud Making Machine VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout JUCE 7.0.5
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 7.0.5
          path: JUCE
          fetch-depth: 1

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -S . -DJUCE_DIR="$env:GITHUB_WORKSPACE/JUCE"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Find VST3
        if: success()
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst3) { Write-Error "VST3 not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse $vst3.FullName artifact

      - name: Upload VST3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CloudMakingMachine-Windows-VST3
          path: artifact

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloudMakingMachine-build-log
          path: build.log
          if-no-files-found: ignore
