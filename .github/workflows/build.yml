
name: Build Minimal Chain VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE
          fetch-depth: 1

      - name: Configure CMake
        run: cmake -B build -S . -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Find VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "*.vst3" | Select-Object -First 1

          if (-not $vst3) {
            Write-Error "VST3 file not found"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse $vst3.FullName artifact

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MinimalChain-Windows-VST3
          path: artifact
